<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#081017" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Sunbridge / 登录</title>
  <link rel="icon" type="image/svg+xml" href="assets/sunbridge-icon.svg" />
  <style>
    :root { color-scheme: dark; --ink: #f2f7f8; --muted: #93a6ad; --bg: #081017; --surface: #0e1b22; --line: rgba(185, 224, 232, 0.16); --line-strong: rgba(185, 224, 232, 0.32); --cyan: #a8edf7; --cyan-strong: #6cd9eb; --danger: #ff9d9d; font-family: "Avenir Next", "Segoe UI Variable", "SF Pro Display", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: radial-gradient(circle at 70% 15%, rgba(108, 217, 235, 0.10), transparent 40%), var(--bg); color: var(--ink); }
    .card { width: min(380px, 100%); padding: 32px 28px 28px; border: 1px solid var(--line); border-radius: 22px; background: var(--surface); box-shadow: 0 25px 70px rgba(0, 0, 0, 0.34); }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
    .brand img { width: 40px; height: 40px; border-radius: 10px; }
    .brand small { display: block; color: var(--muted); font-size: 11px; letter-spacing: 0.14em; }
    .brand strong { font-size: 18px; letter-spacing: 0.02em; }
    label { display: block; margin: 0 0 16px; font-size: 13px; color: var(--muted); }
    input { display: block; width: 100%; margin-top: 7px; padding: 11px 13px; border: 1px solid var(--line-strong); border-radius: 11px; background: rgba(0, 0, 0, 0.25); color: var(--ink); font: inherit; font-size: 15px; }
    input:focus { outline: 2px solid var(--cyan-strong); outline-offset: 1px; border-color: transparent; }
    button { width: 100%; margin-top: 6px; padding: 12px; border: 0; border-radius: 11px; background: var(--cyan); color: #06222a; font: inherit; font-weight: 650; font-size: 15px; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: progress; }
    .message { min-height: 20px; margin: 14px 0 0; font-size: 13px; color: var(--danger); }
    .message.is-info { color: var(--muted); }
    code { color: var(--cyan); }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <img src="assets/sunbridge-icon.svg" alt="" />
      <div><small>SUNBRIDGE / WEB CLIENT</small><strong>登录</strong></div>
    </div>
    <form id="loginForm" autocomplete="on">
      <label>用户名<input id="username" name="username" autocomplete="username" required maxlength="64" autofocus /></label>
      <label>密码<input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024" /></label>
      <button id="submit" type="submit">登录</button>
      <p class="message" id="message" role="alert" aria-live="polite"></p>
    </form>
  </main>
  <script src="login.js"></script>
</body>
</html>
